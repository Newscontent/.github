name: Intern task
description: A scoped intern assignment with repo, folders, and acceptance criteria.
title: "[Intern] "
labels: ["intern", "help wanted"]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line ticket title (also used on the Issue Dashboard).
    validations:
      required: true
  - type: dropdown
    id: repo
    attributes:
      label: Repo
      options:
        - eyenewz-backend
        - eyenewz-android
        - eyenewz-ios
        - eyenewz-website
        - eyenewz-admin
        - eyenewz-netlapse
        - eyenewz-docs
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
      default: 1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing? What does done look like?
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where to look
      description: Server, folder, files. Do not paste secrets.
      placeholder: |
        VPS: ssh root@… then /opt/eyenewz-backend
        Files: api/…
        Do not copy .env into this ticket.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        After creating, add this issue to [EyeNewz Issue Dashboard](https://github.com/orgs/Newscontent/projects/1) and set **Work type** = Intern.
